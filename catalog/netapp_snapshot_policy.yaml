kind: netapp_snapshot_policy
azureType: azurerm_netapp_snapshot_policy
abbr: anfsp
module: Modules/Data/netappSnapshotPolicy
stack: Data
category: Data
icon: netapp-snapshot-policy
required: [name, account_name, location, enabled]
optional:
  - name: hourly_schedule
    type: map(any)
    default: "{}"
    description: Hourly snapshot schedule.
    moduleOnly: true
  - name: daily_schedule
    type: map(any)
    default: "{}"
    description: Daily snapshot schedule.
    moduleOnly: true
args: {}
sockets:
  - name: account_name
    kind: netapp_account
    required: true
blocks:
  - name: hourly_schedule
    forEach: var.hourly_schedule
  - name: daily_schedule
    forEach: var.daily_schedule
