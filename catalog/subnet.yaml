kind: subnet
azureType: azurerm_subnet
abbr: snet
module: Modules/Network/subnet
stack: Network
category: Network
icon: subnet
required: [name, rgName, virtual_network_name]
optional:
  - name: address_prefixes
    type: list(string)
    default: '["10.0.1.0/24"]'
    description: Address prefixes for the subnet.
args:
  rgName: resource_group_name
sockets:
  - name: rgName
    kind: resource_group
    required: true
  - name: virtual_network_name
    kind: vnet
    required: true
blocks: []
