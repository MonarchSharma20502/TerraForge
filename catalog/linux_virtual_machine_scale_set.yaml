kind: linux_virtual_machine_scale_set
azureType: azurerm_linux_virtual_machine_scale_set
abbr: vmss
module: Modules/Compute/linuxVirtualMachineScaleSet
stack: Compute
category: Compute
icon: linux-vm-scale-set
required: [name, rgName, location, sku, admin_username]
optional:
  - name: instances
    type: number
    default: "1"
    description: Number of instances in the scale set.
  - name: tags
    type: map(string)
    default: "{}"
    description: Scale set tags merged with the stack tags.
args:
  rgName: resource_group_name
sockets:
  - name: rgName
    kind: resource_group
    required: true
blocks:
  - name: os_disk
    attributes:
      - name: caching
        value: '"ReadWrite"'
      - name: storage_account_type
        value: '"Premium_LRS"'
  - name: source_image_reference
    attributes:
      - name: publisher
        value: '"Canonical"'
      - name: offer
        value: '"0001-com-ubuntu-server-jammy"'
      - name: sku
        value: '"22_04-lts-gen2"'
      - name: version
        value: '"latest"'
